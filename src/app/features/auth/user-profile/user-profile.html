<div class="grid justify-content-center mt-4">
  <div class="col-12 md:col-8 lg:col-6">
    <p-card>
      <div class="flex flex-column align-items-center text-center">
        
        @if (loading) {
          <p-skeleton shape="circle" size="6rem" styleClass="mb-4"></p-skeleton>
          <p-skeleton width="10rem" height="2rem" styleClass="mb-2"></p-skeleton>
          <p-skeleton width="15rem" height="1.5rem" styleClass="mb-4"></p-skeleton>
        } @else {
          <!-- Avatar por defecto de PrimeNG -->
          <p-avatar icon="pi pi-user" size="xlarge" shape="circle" styleClass="bg-primary text-white mb-4" [style]="{'width': '6rem', 'height': '6rem', 'font-size': '3rem'}"></p-avatar>
          
          <h2 class="m-0 mb-2 text-900 text-2xl font-bold">Mi Perfil</h2>
          <p class="m-0 text-600 mb-4 text-lg">{{ user?.email }}</p>

          <div class="w-full text-left border-top-1 surface-border pt-4 mt-3">
            <h3 class="text-xl font-bold text-700 mb-3">Detalles de la Cuenta</h3>
            
            <div class="flex flex-column gap-3">
              <div class="flex align-items-center justify-content-between">
                <span class="text-600 font-medium">ID de Usuario:</span>
                <span class="text-900">{{ user?.id }}</span>
              </div>
              <div class="flex align-items-center justify-content-between">
                <span class="text-600 font-medium">Último inicio de sesión:</span>
                <span class="text-900">{{ user?.last_sign_in_at | date:'medium' }}</span>
              </div>
              <div class="flex align-items-center justify-content-between">
                <span class="text-600 font-medium">Proveedor:</span>
                <span class="text-900 capitalize">{{ user?.app_metadata?.provider }}</span>
              </div>
            </div>
          </div>
        }
      </div>
    </p-card>
  </div>
</div>
