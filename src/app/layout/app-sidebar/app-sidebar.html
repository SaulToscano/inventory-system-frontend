<div class="surface-0 h-screen hidden lg:block flex-shrink-0 absolute lg:static left-0 top-0 z-1 border-right-1 surface-border w-18rem">
  <div class="flex flex-column h-full">
    
    <!-- Logo de la app -->
    <div class="flex align-items-center px-5 pt-4 flex-shrink-0">
      <i class="pi pi-box text-primary text-3xl mr-2"></i>
      <span class="text-2xl font-bold text-primary">ERP System</span>
    </div>

    <!-- Enlaces del menú -->
    <div class="overflow-y-auto mt-5 px-3">
      <ul class="list-none p-0 m-0">

        <!-- DASHBOARD -->
        <li>
          <!-- Usamos exact: true para que la raíz "/" no esté siempre activa -->
          <a routerLink="/" routerLinkActive="surface-100 text-primary font-bold" [routerLinkActiveOptions]="{exact: true}"
            class="p-ripple flex align-items-center cursor-pointer p-3 border-round text-700 hover:surface-100 transition-duration-150 transition-colors w-full">
            <i class="pi pi-home mr-2"></i>
            <span class="font-medium">Dashboard</span>
          </a>
        </li>

        <!-- GENERAL -->
        <li class="mt-3 text-500 font-medium px-3 text-sm">GENERAL</li>
        <li>
          <a routerLink="/suppliers" routerLinkActive="surface-100 text-primary font-bold"
            class="p-ripple flex align-items-center cursor-pointer p-3 border-round text-700 hover:surface-100 transition-duration-150 transition-colors w-full">
            <i class="pi pi-truck mr-2"></i>
            <span class="font-medium">Proveedores</span>
          </a>
        </li>
        <li>
          <a routerLink="/customers" routerLinkActive="surface-100 text-primary font-bold"
            class="p-ripple flex align-items-center cursor-pointer p-3 border-round text-700 hover:surface-100 transition-duration-150 transition-colors w-full">
            <i class="pi pi-users mr-2"></i>
            <span class="font-medium">Clientes</span>
          </a>
        </li>

        <!-- INVENTARIO -->
        <li class="mt-3 text-500 font-medium px-3 text-sm">INVENTARIO</li>
        <li>
          <a routerLink="/categories" routerLinkActive="surface-100 text-primary font-bold"
            class="p-ripple flex align-items-center cursor-pointer p-3 border-round text-700 hover:surface-100 transition-duration-150 transition-colors w-full">
            <i class="pi pi-sitemap mr-2"></i>
            <span class="font-medium">Categorías</span>
          </a>
        </li>
        <li>
          <a routerLink="/products" routerLinkActive="surface-100 text-primary font-bold"
            class="p-ripple flex align-items-center cursor-pointer p-3 border-round text-700 hover:surface-100 transition-duration-150 transition-colors w-full">
            <i class="pi pi-tags mr-2"></i>
            <span class="font-medium">Productos</span>
          </a>
        </li>
        <li>
          <a routerLink="/stock-entries" routerLinkActive="surface-100 text-primary font-bold"
            class="p-ripple flex align-items-center cursor-pointer p-3 border-round text-700 hover:surface-100 transition-duration-150 transition-colors w-full">
            <i class="pi pi-box mr-2"></i>
            <span class="font-medium">Entradas de stock</span>
          </a>
        </li>

        <!-- VENTAS -->
        <li class="mt-3 text-500 font-medium px-3 text-sm">VENTAS</li>
        <li>
          <!-- Enlace directo para crear factura rápida -->
          <a routerLink="/invoices/new" routerLinkActive="surface-100 text-primary font-bold"
            class="p-ripple flex align-items-center cursor-pointer p-3 border-round text-700 hover:surface-100 transition-duration-150 transition-colors w-full">
            <i class="pi pi-cart-plus mr-2"></i>
            <span class="font-medium">Nueva Factura</span>
          </a>
        </li>
        <li>
          <!-- Historial de facturas -->
          <a routerLink="/invoices" routerLinkActive="surface-100 text-primary font-bold" [routerLinkActiveOptions]="{exact: true}"
            class="p-ripple flex align-items-center cursor-pointer p-3 border-round text-700 hover:surface-100 transition-duration-150 transition-colors w-full">
            <i class="pi pi-receipt mr-2"></i>
            <span class="font-medium">Historial de Ventas</span>
          </a>
        </li>

        <!-- ESTADÍSTICAS -->
        <li class="mt-3 text-500 font-medium px-3 text-sm">ESTADÍSTICAS</li>
        <li>
          <a routerLink="/reports" routerLinkActive="surface-100 text-primary font-bold"
            class="p-ripple flex align-items-center cursor-pointer p-3 border-round text-700 hover:surface-100 transition-duration-150 transition-colors w-full">
            <i class="pi pi-chart-bar mr-2"></i>
            <span class="font-medium">Reportes</span>
          </a>
        </li>

      </ul>
    </div>
    <div class="mt-auto px-3 pb-4">
      <hr class="mb-3 mx-0 border-top-1 border-none surface-border" />
      <a (click)="logout()" class="p-ripple flex align-items-center cursor-pointer p-3 border-round text-red-500 hover:surface-100 transition-duration-150 transition-colors w-full">
        <i class="pi pi-sign-out mr-2"></i>
        <span class="font-medium">Cerrar Sesión</span>
      </a>
    </div>
  </div>
</div>
